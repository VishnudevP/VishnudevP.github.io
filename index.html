<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Vishnudev Poil. A new personal website is in the works." />
    <meta name="theme-color" content="#1c1b1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <title>Vishnudev Poil — Work in progress</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --paper: #1c1b1a;
        --ink: #f0ece3;
        --muted: #aba69e;
        --rule: #3e3a35;
        --accent: #c6ac82;
        --card-paper: #121211;
        --card-ink: #cfb176;
        --shadow: #00000080;
        font-family: "DM Sans", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --paper: #f5f0e8;
          --ink: #2c272b;
          --muted: #6b625f;
          --rule: #d9cdc1;
          --accent: #95483e;
          --shadow: #3a221540;
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { background: var(--paper); }
      body { margin: 0; min-width: 280px; background: var(--paper); color: var(--ink); }
      .page {
        display: flex;
        flex-direction: column;
        width: min(100% - 112px, 1000px);
        min-height: 100svh;
        margin: auto;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 42px 0;
      }
      .name { font-size: 13px; font-weight: 500; letter-spacing: -.25px; }
      .name span { margin: 0 7px; color: var(--accent); }
      .edition, .eyebrow, .status {
        font: 400 10px/1.6 "IBM Plex Mono", monospace;
        letter-spacing: 1px;
      }
      .edition { color: var(--muted); letter-spacing: .6px; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        align-items: center;
        gap: 72px;
        flex: 1;
        padding: 74px 0 100px;
      }
      .eyebrow { display: block; margin: 0 0 26px; color: var(--muted); }
      h1 {
        margin: 0;
        font: 500 clamp(42px, 5.2vw, 66px)/1.05 "DM Sans", sans-serif;
        letter-spacing: -3px;
      }
      h1 em {
        display: block;
        margin-top: 8px;
        color: var(--accent);
        font: italic 400 1.16em/1.03 "Instrument Serif", serif;
        letter-spacing: -1.7px;
      }
      .intro { margin: 28px 0 0; max-width: 305px; color: var(--muted); font-size: 14px; line-height: 1.8; }
      .card-place {
        display: grid;
        place-items: center;
        min-height: 340px;
        perspective: 1100px;
      }
      .card-deal { animation: deal 700ms cubic-bezier(.2, .8, .2, 1) both; }
      .card {
        position: relative;
        width: 210px;
        height: 298px;
        transform: rotate(9deg) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
        transform-style: preserve-3d;
        transition: transform 250ms ease-out;
      }
      .card-face {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 11px;
        background: var(--card-paper);
        color: var(--card-ink);
        box-shadow: 0 24px 32px -20px var(--shadow), inset 0 0 0 1px #cfb17688, inset 0 0 0 3px #242117;
      }
      .card-face::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(115deg, transparent 25%, #cfb17612 44%, #cfb17638 48%, transparent 63%);
        background-size: 220% 100%;
        background-position: var(--glint-x, 50%) 50%;
        opacity: var(--glint-opacity, 0);
        pointer-events: none;
        transition: opacity 250ms ease;
      }
      .card-frame { position: absolute; inset: 15px; border: 1px solid var(--card-ink); border-radius: 4px; opacity: .85; }
      .card-frame::after { content: ""; position: absolute; inset: 4px; border: 1px solid var(--card-ink); border-radius: 1px; opacity: .5; }
      .card-corner {
        display: flex;
        position: absolute;
        z-index: 2;
        flex-direction: column;
        align-items: center;
        padding: 2px 1px;
        background: var(--card-paper);
        font: 400 24px/.9 "Instrument Serif", serif;
      }
      .card-corner small { margin-top: 5px; font: 400 15px/1 "Instrument Serif", serif; }
      .card-corner.top { top: 11px; left: 13px; }
      .card-corner.bottom { right: 13px; bottom: 11px; transform: rotate(180deg); }
      .guilloche { position: absolute; inset: 56px 28px; overflow: hidden; opacity: .5; }
      .guilloche span { position: absolute; inset: 5px; border: 1px solid var(--card-ink); border-radius: 50%; transform: rotate(-30deg); }
      .guilloche span:nth-child(2) { inset: 11px -1px; transform: rotate(30deg); }
      .guilloche span:nth-child(3) { inset: 19px -5px; transform: rotate(60deg); }
      .guilloche span:nth-child(4) { inset: 19px -5px; transform: rotate(-60deg); }
      .guilloche span:nth-child(5) { inset: 30px -15px; transform: rotate(90deg); }
      .card-letter {
        display: flex;
        position: absolute;
        inset: 69px 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font: 400 106px/.65 "Instrument Serif", serif;
        letter-spacing: -5px;
      }
      .card-letter span:last-child { margin-top: 3px; transform: rotate(180deg); }
      .card-imprint { position: absolute; right: 0; bottom: 34px; left: 0; text-align: center; font: 400 8px/1 "DM Sans", sans-serif; letter-spacing: 1.8px; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 28px; border-top: 1px solid var(--rule); padding: 26px 0 32px; }
      .status { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); letter-spacing: .3px; }
      .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
      nav { display: flex; gap: 26px; }
      a { padding: 7px 0; color: var(--muted); font-size: 12px; text-decoration: none; text-underline-offset: 5px; }
      a:hover { color: var(--ink); text-decoration: underline; }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
      @keyframes deal {
        from { opacity: 0; transform: translate(50px, 35px) rotate(-20deg); }
        to { opacity: 1; transform: translate(0, 0) rotate(0); }
      }
      @media (max-width: 760px) {
        .page { width: min(100% - 64px, 560px); }
        header { padding: 30px 0; }
        main { grid-template-columns: 1fr; gap: 42px; padding: 64px 0 68px; }
        h1 { font-size: clamp(43px, 7.6vw, 60px); letter-spacing: -2px; }
        .intro { max-width: none; }
        .card-place { min-height: 280px; }
        .card { width: 178px; height: 253px; }
        .card-frame { inset: 13px; }
        .card-corner { font-size: 20px; }
        .card-corner small { font-size: 13px; }
        .card-corner.top { top: 10px; left: 11px; }
        .card-corner.bottom { right: 11px; bottom: 10px; }
        .guilloche { inset: 47px 24px; }
        .card-letter { inset: 58px 0; font-size: 90px; }
        .card-imprint { bottom: 29px; font-size: 7px; }
        footer { gap: 16px; }
      }
      @media (max-width: 380px) {
        .page { width: calc(100% - 40px); }
        .edition { font-size: 9px; }
        header { gap: 12px; }
        main { padding-top: 48px; }
        footer { align-items: flex-start; flex-direction: column; gap: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        .card { transform: rotate(9deg); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <span class="name">vishnu<span>/</span>poil</span>
        <span class="edition">PERSONAL WEBSITE</span>
      </header>
      <main>
        <div>
          <span class="eyebrow">VISHNUDEV POIL</span>
          <h1>Work in<em>progress.</em></h1>
          <p class="intro">I’m rebuilding my website. Check back soon.</p>
        </div>
        <div class="card-place" aria-hidden="true">
          <div class="card-deal">
            <div class="card">
              <div class="card-face">
                <span class="card-frame"></span>
                <span class="card-corner top">V<small>P</small></span>
                <span class="card-corner bottom">V<small>P</small></span>
                <span class="guilloche"><span></span><span></span><span></span><span></span><span></span></span>
                <span class="card-letter"><span>V</span><span>V</span></span>
                <span class="card-imprint">VISHNUDEV POIL</span>
              </div>
            </div>
          </div>
        </div>
      </main>
      <footer>
        <span class="status">Thanks for stopping by.</span>
        <nav aria-label="Find me elsewhere">
          <a href="https://github.com/VishnudevP" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/vishnudev-poil" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        </nav>
      </footer>
    </div>
    <script>
      (() => {
        const card = document.querySelector(".card");
        const area = document.querySelector(".card-place");
        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        const reset = () => {
          card.style.removeProperty("--tilt-x");
          card.style.removeProperty("--tilt-y");
          card.style.removeProperty("--glint-x");
          card.style.removeProperty("--glint-opacity");
        };
        area.addEventListener("pointermove", (event) => {
          if (motion.matches || event.pointerType !== "mouse") return;
          const rect = area.getBoundingClientRect();
          const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
          card.style.setProperty("--tilt-x", `${(0.5 - y) * 10}deg`);
          card.style.setProperty("--tilt-y", `${(x - 0.5) * 14}deg`);
          card.style.setProperty("--glint-x", `${x * 100}%`);
          card.style.setProperty("--glint-opacity", ".8");
        });
        area.addEventListener("pointerleave", reset);
        area.addEventListener("pointercancel", reset);
        motion.addEventListener("change", reset);
      })();
    </script>
  </body>
</html>
